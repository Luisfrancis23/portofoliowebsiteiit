<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c9a0"/>
      <stop offset="1" stop-color="#d99e6c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(148,163,184,0.10)"/>
    </pattern>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#grid)"/>
  <circle cx="320" cy="300" r="250" fill="url(#glow)"/>

  <!-- dekorasaun sirkuitu -->
  <g stroke="rgba(96,165,250,0.5)" stroke-width="3" fill="none">
    <path d="M70 140h60l30 30"/>
    <path d="M570 140h-60l-30 30"/>
    <path d="M70 500h60l30-30"/>
    <path d="M570 500h-60l-30-30"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="70" cy="140" r="7"/>
    <circle cx="570" cy="140" r="7"/>
    <circle cx="70" cy="500" r="7"/>
    <circle cx="570" cy="500" r="7"/>
    <circle cx="160" cy="170" r="5"/>
    <circle cx="480" cy="170" r="5"/>
    <circle cx="160" cy="470" r="5"/>
    <circle cx="480" cy="470" r="5"/>
  </g>

  <!-- Ombro / kamisa -->
  <path d="M150 640 C150 520 225 470 320 470 C415 470 490 520 490 640 Z" fill="url(#shirt)"/>
  <!-- Kolar -->
  <path d="M292 470 L320 512 L348 470 L320 492 Z" fill="#dbeafe" opacity="0.9"/>
  <!-- Pescoço -->
  <rect x="296" y="400" width="48" height="70" rx="22" fill="#d99e6c"/>

  <!-- Kabeça -->
  <circle cx="320" cy="310" r="96" fill="url(#skin)"/>
  <!-- Kabele -->
  <path d="M224 320 C224 228 262 196 320 196 C378 196 416 228 416 320 C416 272 380 246 320 246 C260 246 224 272 224 320 Z" fill="#16213f"/>
  <!-- Oculos -->
  <rect x="252" y="292" width="58" height="38" rx="14" fill="rgba(10,18,38,0.35)" stroke="#0a1226" stroke-width="7"/>
  <rect x="330" y="292" width="58" height="38" rx="14" fill="rgba(10,18,38,0.35)" stroke="#0a1226" stroke-width="7"/>
  <path d="M310 306h20" stroke="#0a1226" stroke-width="7" stroke-linecap="round"/>
  <!-- Sorriso -->
  <path d="M298 362 Q320 378 342 362" fill="none" stroke="#8a5a33" stroke-width="6" stroke-linecap="round"/>

  <!-- Headset -->
  <path d="M212 330 a108 108 0 0 1 216 0" fill="none" stroke="#3b82f6" stroke-width="15" stroke-linecap="round"/>
  <rect x="200" y="308" width="26" height="56" rx="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="414" y="308" width="26" height="56" rx="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M427 352 C436 402 390 416 352 400" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <circle cx="346" cy="400" r="10" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
</svg>
